<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><title>RBS | Alta Performance</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f4f7fb;font-family:Inter,system-ui,Arial}.app{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:900;font-size:22px}.muted{color:#8d9ab0}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:20px}.card{background:linear-gradient(145deg,#101827,#0c1220);border:1px solid #202c40;border-radius:20px;padding:18px;box-shadow:0 16px 40px #0005}.hero{grid-column:span 8}.score{grid-column:span 4}.half{grid-column:span 6}.full{grid-column:span 12}h1,h2,p{margin-top:0}h1{font-size:34px;margin-bottom:6px}.scoreN{font-size:52px;font-weight:900}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 14px;background:#2878ff;color:white;font-weight:800;cursor:pointer}.btn.alt{background:#18243a}.input,textarea,select{width:100%;background:#080e19;border:1px solid #27354d;color:white;border-radius:12px;padding:12px;margin:6px 0 10px}textarea{min-height:100px;resize:vertical}.item{padding:12px;border:1px solid #23314a;border-radius:13px;margin:8px 0;background:#0a111e}.done{opacity:.5;text-decoration:line-through}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#182a49;color:#9fc4ff;font-size:12px;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:#080e19;border-radius:14px;padding:12px}.kpi b{font-size:22px;display:block}.nav{position:sticky;bottom:10px;margin:22px auto 0;background:#101827dd;backdrop-filter:blur(12px);border:1px solid #283650;border-radius:18px;padding:9px;display:flex;justify-content:space-around}.nav button{background:none;color:#cbd5e1;border:0;font-weight:700}@media(max-width:750px){.hero,.score,.half{grid-column:span 12}.app{padding:16px}h1{font-size:28px}}</style></head><body><main class="app"><div class="top"><div><div class="brand">RBS • COMMAND CENTER</div><div class="muted" id="date"></div></div><button class="btn" onclick="enableNotifications()">🔔 Ativar alertas</button></div><section class="grid"><div class="card hero"><span class="pill">FOCO DE HOJE</span><h1>Alta Performance</h1><p class="muted">Planeje, execute, registre e feche o dia sabendo exatamente o que avançou.</p><input id="focus" class="input" placeholder="Qual é a vitória principal de hoje?" oninput="save()"><div class="kpis"><div class="kpi"><span class="muted">Tarefas</span><b id="kt">0</b></div><div class="kpi"><span class="muted">Concluídas</span><b id="kd">0</b></div><div class="kpi"><span class="muted">Execução</span><b id="kp">0%</b></div></div></div><div class="card score"><span class="muted">SCORE DO DIA</span><div class="scoreN" id="score">0</div><p class="muted">Baseado na sua execução.</p><button class="btn alt" onclick="closeDay()">Fechar meu dia</button></div><div class="card half"><h2>⚡ Prioridades</h2><div class="row"><input id="task" class="input" style="flex:1" placeholder="Nova tarefa / prioridade"><button class="btn" onclick="addTask()">Adicionar</button></div><div id="tasks"></div></div><div class="card half"><h2>📅 Agenda</h2><div class="row"><input id="event" class="input" style="flex:2" placeholder="Compromisso"><input id="etime" class="input" style="flex:1" type="time"><button class="btn" onclick="addEvent()">Agendar</button></div><div id="events"></div></div><div class="card half"><h2>🧠 Anotações rápidas</h2><textarea id="notes" placeholder="Ideias, decisões, recados, aprendizados..." oninput="save()"></textarea><button class="btn alt" onclick="stamp()">+ Registrar horário</button></div><div class="card half"><h2>🎯 Gestão & Trabalho</h2><textarea id="work" placeholder="Equipe, números, problemas, oportunidades, decisões e acompanhamentos..." oninput="save()"></textarea><select id="energy" onchange="save()"><option value="">Energia agora</option><option>🔥 Muito alta</option><option>⚡ Alta</option><option>🟢 Boa</option><option>🟡 Média</option><option>🔴 Baixa</option></select></div><div class="card full"><h2>🌙 Fechamento</h2><div class="row"><textarea id="wins" style="flex:1" placeholder="Vitórias do dia" oninput="save()"></textarea><textarea id="tomorrow" style="flex:1" placeholder="O que não pode faltar amanhã?" oninput="save()"></textarea></div></div></section><nav class="nav"><button onclick="task.focus()">＋ Tarefa</button><button onclick="event.focus()">📅 Agenda</button><button onclick="notes.focus()">✍️ Nota</button><button onclick="window.scrollTo({top:0,behavior:'smooth'})">⌂ Hoje</button></nav></main><script>const KEY='rbs-performance-v1';let data=JSON.parse(localStorage.getItem(KEY)||'{"tasks":[],"events":[]}');const $=id=>document.getElementById(id);date.textContent=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(new Date());['focus','notes','work','wins','tomorrow','energy'].forEach(k=>{if($(k))$(k).value=data[k]||''});function save(){['focus','notes','work','wins','tomorrow','energy'].forEach(k=>data[k]=$(k)?.value||'');localStorage.setItem(KEY,JSON.stringify(data));render()}function addTask(){let v=task.value.trim();if(!v)return;data.tasks.push({t:v,d:false,at:Date.now()});task.value='';save()}function toggle(i){data.tasks[i].d=!data.tasks[i].d;save()}function delTask(i){data.tasks.splice(i,1);save()}function addEvent(){let v=event.value.trim(),tm=etime.value;if(!v)return;data.events.push({t:v,time:tm,notified:false});data.events.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));event.value='';etime.value='';save()}function delEvent(i){data.events.splice(i,1);save()}function stamp(){notes.value+=(notes.value?'\n':'')+'['+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'] ';notes.focus();save()}function render(){tasks.innerHTML=data.tasks.map((x,i)=>`<div class="item ${x.d?'done':''}"><input type="checkbox" ${x.d?'checked':''} onchange="toggle(${i})"> ${x.t}<button style="float:right;background:none;border:0;color:#8996aa" onclick="delTask(${i})">✕</button></div>`).join('')||'<p class="muted">Defina suas 3 prioridades críticas.</p>';events.innerHTML=data.events.map((x,i)=>`<div class="item"><b>${x.time||'--:--'}</b> · ${x.t}<button style="float:right;background:none;border:0;color:#8996aa" onclick="delEvent(${i})">✕</button></div>`).join('')||'<p class="muted">Sua agenda está livre.</p>';let total=data.tasks.length,done=data.tasks.filter(x=>x.d).length,p=total?Math.round(done/total*100):0;kt.textContent=total;kd.textContent=done;kp.textContent=p+'%';score.textContent=Math.min(100,p+(data.focus?10:0)+(data.notes?5:0));}async function enableNotifications(){if(!('Notification'in window))return alert('Notificações não suportadas neste navegador.');let p=await Notification.requestPermission();alert(p==='granted'?'Alertas ativados. Mantenha o app instalado/aberto para os lembretes locais.':'Permissão de notificação não concedida.')}function checkEvents(){if(Notification.permission!=='granted')return;let now=new Date(),hh=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');data.events.forEach(e=>{if(e.time===hh&&!e.notified){new Notification('RBS Agenda',{body:e.t});e.notified=true;localStorage.setItem(KEY,JSON.stringify(data))}})}function closeDay(){let d=data.tasks.filter(x=>x.d).length,t=data.tasks.length;alert(`Fechamento: ${d}/${t} tarefas concluídas. Execução ${t?Math.round(d/t*100):0}%. Registre as vitórias e a prioridade de amanhã.`)}setInterval(checkEvents,30000);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
